services:
  postgres:
    image: postgres:16-alpine
    container_name: ohana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ohana_moments
      POSTGRES_USER: ohana_user
      POSTGRES_PASSWORD: ohana_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohana_user -d ohana_moments"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
